name: Wandr
options:
  bundleIdPrefix: com.wandr.app
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
targets:
  Wandr:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Wandr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wandr.traveldiary
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Wandr needs access to your photo library so you can attach photos to your travel memories."
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
